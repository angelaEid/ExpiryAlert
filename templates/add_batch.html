
{% extends "base.html" %}

{% block content %}

<h1>Add Inventory Batch</h1>

<p class="subtitle">
    Register newly received food inventory.
</p>

{% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
        <div class="status {{ 'safe' if category == 'success' else 'expired' }}"
             style="margin-bottom: 15px;">
            {{ message }}
        </div>
    {% endfor %}
{% endwith %}

<form method="POST" action="{{ url_for('inventory.add_batch') }}">

    <div class="form-group">
        <label for="purchase_item_id">Purchase Item</label>
        <select id="purchase_item_id" name="purchase_item_id" required>
            <option value="">Select Purchase Item</option>

            {% for item in purchase_items %}
            <option value="{{ item.purchase_item_id }}">
                {{ item.product_name }}
                - Purchase Item #{{ item.purchase_item_id }}
                (Quantity: {{ item.quantity }})
            </option>
            {% endfor %}
        </select>
    </div>

    <div class="form-group">
        <label for="storage_id">Storage Location</label>
        <select id="storage_id" name="storage_id" required>
            <option value="">Select Storage Location</option>

            {% for location in storage_locations %}
            <option value="{{ location.storage_id }}">
                {{ location.storage_name }}
                ({{ location.storage_type }})
            </option>
            {% endfor %}
        </select>
    </div>

    <div class="form-group">
        <label for="received_date">Received Date</label>
        <input type="date"
               id="received_date"
               name="received_date"
               value="{{ today }}"
               required>
    </div>

    <div class="form-group">
        <label for="expiration_date">Expiration Date</label>
        <input type="date"
               id="expiration_date"
               name="expiration_date"
               required>
    </div>

    <div class="form-group">
        <label for="initial_quantity">Initial Quantity</label>
        <input type="number"
               id="initial_quantity"
               name="initial_quantity"
               min="0.01"
               max="99999999.99"
               step="0.01"
               placeholder="Enter quantity"
               required>
    </div>

    <div style="margin-top: 25px;">
        <button type="submit" class="form-button">
            Add Inventory Batch
        </button>

        <a href="{{ url_for('inventory.inventory') }}"
           style="margin-left: 15px;">
            Cancel
        </a>
    </div>

</form>

{% endblock %}
