
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}ExpiryAlert{% endblock %}</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <div class="container">

        <header class="site-header">
            <div class="brand">
                <h2>ExpiryAlert</h2>
                <p>Restaurant Food Inventory Management System</p>
            </div>

            <nav class="navigation">
                <a href="{{ url_for('main.home') }}">Home</a>
                <a href="{{ url_for('inventory.inventory') }}">Inventory</a>
                <a href="{{ url_for('alerts.alerts') }}">Expiration Alerts</a>
            </nav>
        </header>

        <main>
            {% block content %}{% endblock %}
        </main>

        <footer class="footer">
            ExpiryAlert - Restaurant Food Inventory Management System
        </footer>

    </div>
</body>
</html>
